version: 2.1

jobs:
  test-and-report:
    docker:
      - image: cimg/openjdk:21.0
    working_directory: ~/project
    steps:
      - checkout
      
      # Cache dependencies
      - restore_cache:
          keys:
            - maven-deps-v2-{{ checksum "pom.xml" }}
            - maven-deps-v2-
      
      # Download dependencies
      - run:
          name: Download Dependencies
          command: mvn dependency:resolve dependency:resolve-sources
      
      # Save dependency cache
      - save_cache:
          paths:
            - ~/.m2
          key: maven-deps-v2-{{ checksum "pom.xml" }}
      
      # Run tests without coverage (JaCoCo disabled)
      - run:
          name: Run Tests
          command: |
            mvn clean test \
              -Dtest.environment=prod \
              -Dmaven.test.failure.ignore=true
      
      # Debug: Check what test result files were generated
      - run:
          name: Debug - List generated test files
          command: |
            echo "=== Surefire Reports Directory ==="
            ls -la target/surefire-reports/ || echo "No surefire-reports directory"
            echo "=== Looking for TEST-*.xml files ==="
            find target -name "TEST-*.xml" -type f || echo "No TEST-*.xml files found"
            echo "=== Looking for any XML files ==="
            find target -name "*.xml" -type f || echo "No XML files found"
          when: always
      
      # Generate HTML test reports (JaCoCo disabled)
      - run:
          name: Generate Test Reports
          command: mvn surefire-report:report-only
          when: always
      
      # Create a clean directory with only JUnit XML files for CircleCI
      - run:
          name: Prepare JUnit XML for CircleCI
          command: |
            mkdir -p /tmp/test-results/junit
            # Copy JUnit XML files if they exist
            if ls target/surefire-reports/TEST-*.xml 1> /dev/null 2>&1; then
              cp target/surefire-reports/TEST-*.xml /tmp/test-results/junit/
            fi
            # Also copy junitreports if they exist
            if ls target/surefire-reports/junitreports/TEST-*.xml 1> /dev/null 2>&1; then
              cp target/surefire-reports/junitreports/TEST-*.xml /tmp/test-results/junit/
            fi
            # List what we found
            echo "Files in test results:"
            ls -la /tmp/test-results/junit/ || echo "No files found"
          when: always
      
      # Store only JUnit XML files for CircleCI dashboard
      - store_test_results:
          path: /tmp/test-results
      
      # Store comprehensive HTML reports
      - store_artifacts:
          path: target/site
          destination: html-reports
      
      # Store raw test results
      - store_artifacts:
          path: target/surefire-reports
          destination: raw-test-results

workflows:
  test-and-report:
    jobs:
      - test-and-report