version: 2.1

jobs:
  test-and-report:
    docker:
      - image: cimg/openjdk:21.0
    working_directory: ~/project
    
    steps:
      - checkout
      
      # Restore dependencies cache
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "pom.xml" }}
            - v1-dependencies-
      
      # Install dependencies
      - run:
          name: Install Dependencies
          command: mvn dependency:go-offline
      
      # Save dependencies cache
      - save_cache:
          paths:
            - ~/.m2
          key: v1-dependencies-{{ checksum "pom.xml" }}
      
      # Run tests using TestNG suite
      - run:
          name: Run TestNG Tests
          command: |
            mvn clean test \
              -Dtest.environment=prod \
              -Dmaven.test.failure.ignore=true
      
      # Collect test results for CircleCI Tests tab
      - run:
          name: Collect Test Results for CircleCI
          command: |
            mkdir -p /tmp/test-results/testng
            if ls target/surefire-reports/TEST-*.xml 1> /dev/null 2>&1; then
              cp target/surefire-reports/TEST-*.xml /tmp/test-results/testng/
              echo "Test XML files collected for CircleCI dashboard"
              echo "Files collected:"
              ls -la /tmp/test-results/testng/
            else
              echo "Warning: No TEST-*.xml files found"
            fi
          when: always
      
      # Store test results for CircleCI Tests tab
      - store_test_results:
          path: /tmp/test-results
      
      # Store Extent HTML reports as artifacts
      - store_artifacts:
          path: target/extent-reports
          destination: extent-reports
      
      # Store TestNG reports as artifacts  
      - store_artifacts:
          path: target/surefire-reports
          destination: testng-reports

workflows:
  test-and-report:
    jobs:
      - test-and-report