version: 2.1

jobs:
  test-and-report:
    docker:
      - image: cimg/openjdk:21.0
    working_directory: ~/project
    steps:
      - checkout
      
      # Cache dependencies
      - restore_cache:
          keys:
            - maven-deps-v2-{{ checksum "pom.xml" }}
            - maven-deps-v2-
      
      # Download dependencies
      - run:
          name: Download Dependencies
          command: mvn dependency:resolve dependency:resolve-sources
      
      # Save dependency cache
      - save_cache:
          paths:
            - ~/.m2
          key: maven-deps-v2-{{ checksum "pom.xml" }}
      
      # Run tests with coverage
      - run:
          name: Run Tests
          command: |
            mvn clean test \
              -Dtest.environment=prod \
              -Dmaven.test.failure.ignore=true
      
      # Generate HTML test reports
      - run:
          name: Generate Test Reports
          command: mvn surefire-report:report-only site:site
          when: always
      
      # Create a clean directory with only JUnit XML files for CircleCI
      - run:
          name: Prepare JUnit XML for CircleCI
          command: |
            mkdir -p /tmp/junit-results
            find target/surefire-reports -name "TEST-*.xml" -exec cp {} /tmp/junit-results/ \;
          when: always
      
      # Store only JUnit XML files for CircleCI dashboard
      - store_test_results:
          path: /tmp/junit-results
      
      # Store comprehensive HTML reports
      - store_artifacts:
          path: target/site
          destination: html-reports
      
      # Store JaCoCo coverage reports
      - store_artifacts:
          path: target/site/jacoco
          destination: coverage-reports
      
      # Store raw test results
      - store_artifacts:
          path: target/surefire-reports
          destination: raw-test-results

workflows:
  test-and-report:
    jobs:
      - test-and-report